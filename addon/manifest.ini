name = keyPresser
summary = "Key Presser"
description = """Sends keystrokes, typed text or mouse clicks repeatedly at a configurable interval. Works with games and engines that read raw input, such as SDL and DirectInput titles, as well as with ordinary Windows programs. Profiles, safety limits and an instant stop key are included. Press NVDA+y for settings, NVDA+j to start or stop, NVDA+z to stop immediately."""
author = "BlindSoldier52"
url = https://github.com/BlindSoldier52/keyPresser
version = 1.0
docFileName = readme.html
minimumNVDAVersion = 2019.3
lastTestedNVDAVersion = 2026.1
